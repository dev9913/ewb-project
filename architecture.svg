<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="920" height="580">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="100%" style="stop-color:#1a2744"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="920" height="580" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="460" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AWS VPC Peering Architecture</text>
  <text x="460" y="56" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#A0AEC0" text-anchor="middle">Dev Jangir  •  EWB Cloud Labs  •  ap-south-1</text>
  
  <!-- Laptop box -->
  <rect x="360" y="75" width="200" height="48" rx="8" fill="#2D3748" stroke="#4A5568" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="460" y="95" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#E2E8F0" text-anchor="middle">Your Laptop</text>
  <text x="460" y="111" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#A0AEC0" text-anchor="middle">SSH Client + ProxyJump</text>
  
  <!-- Arrow down to IGW -->
  <line x1="460" y1="123" x2="460" y2="145" stroke="#00C853" stroke-width="2"/>
  <polygon points="460,152 454,142 466,142" fill="#00C853"/>
  <text x="480" y="140" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#00C853">SSH / 22</text>
  
  <!-- Internet Gateway -->
  <rect x="360" y="155" width="200" height="40" rx="6" fill="#1A365D" stroke="#3182CE" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="460" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#90CDF4" text-anchor="middle">Internet Gateway (ewb-igw-a)</text>
  
  <!-- Arrow into VPC A -->
  <line x1="460" y1="195" x2="460" y2="218" stroke="#00C853" stroke-width="2"/>
  <polygon points="460,225 454,215 466,215" fill="#00C853"/>
  
  <!-- ========== VPC A ========== -->
  <rect x="40" y="230" width="400" height="300" rx="12" fill="#1A202C" stroke="#4299E1" stroke-width="2" filter="url(#shadow)"/>
  <text x="55" y="255" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#63B3ED">VPC A  •  10.10.0.0/16</text>
  <text x="55" y="272" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#A0AEC0">ewb-vpc-a</text>
  
  <!-- Public Subnet A -->
  <rect x="60" y="290" width="360" height="90" rx="8" fill="#2A4365" stroke="#4299E1" stroke-width="1.2"/>
  <text x="75" y="310" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#90CDF4">Public Subnet  •  10.10.1.0/24</text>
  <text x="75" y="325" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#A0AEC0">ewb-a-public</text>
  
  <!-- Bastion -->
  <rect x="90" y="338" width="160" height="32" rx="5" fill="#2B6CB0" stroke="#63B3ED" stroke-width="1"/>
  <text x="170" y="358" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#EBF8FF" text-anchor="middle">Bastion  10.10.1.10</text>
  
  <!-- Private Subnet A -->
  <rect x="60" y="400" width="360" height="90" rx="8" fill="#234E52" stroke="#38B2AC" stroke-width="1.2"/>
  <text x="75" y="420" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#81E6D9">Private Subnet  •  10.10.2.0/24</text>
  <text x="75" y="435" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#A0AEC0">ewb-a-private</text>
  
  <!-- App-A -->
  <rect x="90" y="448" width="160" height="32" rx="5" fill="#2C7A7B" stroke="#4FD1C5" stroke-width="1"/>
  <text x="170" y="468" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#E6FFFA" text-anchor="middle">App-A  10.10.2.10</text>
  
  <!-- Arrow Public to Private inside VPC A -->
  <line x1="170" y1="370" x2="170" y2="398" stroke="#4FD1C5" stroke-width="1.5" stroke-dasharray="4,2"/>
  <polygon points="170,400 165,392 175,392" fill="#4FD1C5"/>
  
  <!-- ========== VPC B ========== -->
  <rect x="480" y="230" width="400" height="300" rx="12" fill="#1A202C" stroke="#48BB78" stroke-width="2" filter="url(#shadow)"/>
  <text x="495" y="255" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#68D391">VPC B  •  10.20.0.0/16</text>
  <text x="495" y="272" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#A0AEC0">ewb-vpc-b  •  No Internet Gateway</text>
  
  <!-- Private Subnet B -->
  <rect x="500" y="320" width="360" height="130" rx="8" fill="#22543D" stroke="#48BB78" stroke-width="1.2"/>
  <text x="515" y="345" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#9AE6B4">Private Subnet  •  10.20.1.0/24</text>
  <text x="515" y="362" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#A0AEC0">ewb-b-private</text>
  
  <!-- App-B -->
  <rect x="560" y="390" width="160" height="32" rx="5" fill="#276749" stroke="#68D391" stroke-width="1"/>
  <text x="640" y="410" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#F0FFF4" text-anchor="middle">App-B  10.20.1.10</text>
  
  <!-- ========== PEERING CONNECTION ========== -->
  <!-- Horizontal line between VPCs -->
  <line x1="440" y1="420" x2="480" y2="420" stroke="#00C853" stroke-width="3"/>
  
  <!-- Peering label box -->
  <rect x="415" y="400" width="90" height="40" rx="6" fill="#064E3B" stroke="#00C853" stroke-width="1.5"/>
  <text x="460" y="417" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#00C853" text-anchor="middle">pcx</text>
  <text x="460" y="431" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#6EE7B7" text-anchor="middle">Peering</text>
  
  <!-- Double arrow heads -->
  <polygon points="440,420 448,414 448,426" fill="#00C853"/>
  <polygon points="480,420 472,414 472,426" fill="#00C853"/>
  
  <!-- Footer note -->
  <text x="460" y="555" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Administration: Laptop → Bastion → App-A / App-B   |   Project traffic: App-A ↔ App-B over private IPs</text>
  <text x="460" y="570" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#4A5568" text-anchor="middle">Peering is non-transitive • VPC B has no internet access through VPC A</text>
</svg>
